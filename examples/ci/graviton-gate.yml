# Graviton CI gate - COPY THIS INTO YOUR OWN Go PROJECT
#
#   cp examples/ci/graviton-gate.yml .github/workflows/graviton-gate.yml
#
# What it enforces, and why each job is here rather than folded into one:
#
#   1. arm64-build   - the module builds for linux/arm64. Cheapest possible gate,
#                      runs on the x86 runner by cross-compiling, seconds.
#   2. arm64-native  - it builds, vets and tests ON arm64 with the CGO_ENABLED
#                      your deployment uses. Cross-compiling executes nothing.
#   3. race          - `go test -race` on BOTH architectures. The detector is
#                      instrumentation, not a hardware probe, so x86 is not a
#                      weaker detector - but a race that fires here is a 22-38%
#                      event on Graviton and 0 in 1.2e9 samples on x86 (measured
#                      on c7g.2xlarge vs c7i.2xlarge), so this is the job that
#                      earns its minutes.
#   4. arch-scan     - the skill's static scan, as a soft gate. It is advisory by
#                      default: turn SCAN_STRICT to 1 once your repo is clean, and
#                      it becomes a hard gate against regressions.
#
# Prerequisites: GitHub-hosted arm64 runners (`ubuntu-24.04-arm`) or your own
# arm64 self-hosted runner. Replace the runner labels if self-hosting.

name: graviton-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Set these two to match your DEPLOYMENT, not your laptop.
  DEPLOY_CGO_ENABLED: '0'
  DEPLOY_BUILD_TAGS: ''        # e.g. 'netgo,osusergo'
  SCAN_STRICT: '0'             # 1 = the static scan fails the build

jobs:
  arm64-build:
    name: cross-build linux/arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: GOOS=linux GOARCH=arm64 go build ./...
        run: |
          set -eux
          TAGS=""; [ -n "$DEPLOY_BUILD_TAGS" ] && TAGS="-tags=$DEPLOY_BUILD_TAGS"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build $TAGS ./...
      - name: no package excluded on arm64 but not on amd64
        run: |
          # `./...` silently skips a package nothing imports, so name every
          # package directory explicitly. Measured: go list, go build AND go vet
          # all report zero errors for an unimported amd64-only package.
          # Directories follow the go command's rules (testdata/, vendor/, _* and
          # .* are never built), and only THIS module's directories are listed: a
          # nested go.mod is another module - add a matrix entry for it.
          set -u
          TAGS="$DEPLOY_BUILD_TAGS"
          find . \( -type d \( -name vendor -o -name testdata -o -name '_*' -o -name '.?*' \) -prune \) \
              -o \( -type d ! -name . -exec test -f '{}/go.mod' \; -prune \) \
              -o \( -type f -name '*.go' ! -name '_*' -print \) \
            | sed 's|/[^/]*$||' | sort -u > /tmp/pkgdirs
          for a in arm64 amd64; do
            # one batched call per architecture; -e records per-package errors
            tr '\n' '\0' < /tmp/pkgdirs \
              | xargs -0 env CGO_ENABLED=1 GOOS=linux GOARCH=$a go list -e -tags="$TAGS" \
                  -f '{{.Dir}}{{"\t"}}{{with .Error}}{{.Err}}{{end}}' \
              | grep 'build constraints exclude all Go files' | cut -f1 | sort -u > /tmp/$a.dirs || true
          done
          if ! comm -23 /tmp/arm64.dirs /tmp/amd64.dirs | grep -q .; then
            echo "no arm64-only package exclusions"; exit 0
          fi
          echo "::error::packages build for amd64 but not arm64:"
          comm -23 /tmp/arm64.dirs /tmp/amd64.dirs
          exit 1

  arm64-native:
    name: native build + vet + test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }      # the baseline
          - { arch: arm64, runner: ubuntu-24.04-arm }  # the target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: |
          set -eux
          TAGS=""; [ -n "$DEPLOY_BUILD_TAGS" ] && TAGS="-tags=$DEPLOY_BUILD_TAGS"
          CGO_ENABLED="$DEPLOY_CGO_ENABLED" go build $TAGS ./...
          CGO_ENABLED="$DEPLOY_CGO_ENABLED" go vet  $TAGS ./...
          CGO_ENABLED="$DEPLOY_CGO_ENABLED" go test $TAGS ./...
      - name: binary architecture
        run: |
          set -eux
          TAGS=""; [ -n "$DEPLOY_BUILD_TAGS" ] && TAGS="-tags=$DEPLOY_BUILD_TAGS"
          mkdir -p /tmp/bin
          CGO_ENABLED="$DEPLOY_CGO_ENABLED" go build $TAGS -o /tmp/bin/ ./... || true
          for b in /tmp/bin/*; do [ -f "$b" ] && file -b "$b"; done

  race:
    name: go test -race (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: go test -race ./...
        run: |
          set -eux
          TAGS=""; [ -n "$DEPLOY_BUILD_TAGS" ] && TAGS="-tags=$DEPLOY_BUILD_TAGS"
          # -race needs cgo and a C compiler, whatever the deployment sets.
          # Building the TEST binary with cgo on does not change the shipped binary.
          CGO_ENABLED=1 go test -race $TAGS ./... 2>&1 | tee /tmp/race.out
      - name: fail on any data race
        if: always()
        run: |
          if grep -q 'WARNING: DATA RACE' /tmp/race.out 2>/dev/null; then
            echo "::error::data race on ${{ matrix.arch }} - see the full report in the log."
            echo "::error::A race is a pre-existing defect. On Graviton it is a 22-38% event."
            echo "::error::Fix it with a synchronization primitive. Never with a sleep, a"
            echo "::error::statement reorder, runtime.Gosched or a GOGC/GOMAXPROCS change."
            exit 1
          fi

  arch-scan:
    name: graviton static scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - name: fetch the scanner
        run: |
          git clone --depth 1 -q \
            https://github.com/aws-samples/sample-go-x86-to-graviton-skill.git /tmp/gvskill
          chmod +x /tmp/gvskill/scripts/go_arch_scan.sh
      - name: scan
        run: |
          set -u
          # The scanner needs a resolvable module graph; without it every verdict
          # is CHECK and the gate is meaningless.
          go mod download
          # Exit 1 means FINDINGs (arm64 work required). Advisories - such as "this
          # project never runs -race" - do not fail the scan unless -strict is given.
          # -o keeps a copy of the report while it prints to the log; add -json for
          # a machine-readable report instead.
          /tmp/gvskill/scripts/go_arch_scan.sh -tags "$DEPLOY_BUILD_TAGS" -o /tmp/scan.out .
          RC=$?
          [ $RC -eq 2 ] && { echo "::error::the scanner could not run"; exit 1; }
          grep -q 'RESOLUTION FAILED' /tmp/scan.out && {
            echo "::error::module resolution failed - the scan proved nothing"; exit 1; }
          if [ $RC -eq 1 ]; then
            if [ "$SCAN_STRICT" = "1" ]; then
              echo "::error::Graviton findings and SCAN_STRICT=1 - see the log"; exit 1
            fi
            echo "::warning::Graviton findings - see the log"
          fi
          exit 0
